windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_ProcessStatus", "Win32_Storage_Xps", "Win32_System_Variant", "Win32_System_Ole", "Win32_Graphics_Dwm", "Win32_System_SystemServices", "Win32_UI_Shell"] }
